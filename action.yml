name: 'Vertex AI Notebook Review Action'
description: 'Execute notebooks and create links to their output files'
inputs:
  gcs_source_bucket:
    description: 'Google Cloud Storage bucket to store notebooks to be run by Vertex AI. e.g. <project-id>/nbr/source'
    required: true
  gcs_output_bucket:
    description: 'Google Cloud Storage bucket to store the results of the notebooks executed by Vertex AI. e.g. <project-id>/nbr/output'
    required: true
  allowlist:
    description: 'Comma separated list of files to run on Vertex AI. e.g. mynotebook.ipynb, somedir/**.pynb. It is expected that this is the output from an action like ```dorny/paths-filter```'
    required: true
  vertex_machine_type:
    description: 'Type of Vertex AI machine to run notebooks on e.g. n1-standard-4'
    default: 'n1-standard-4'
    required: false
  region:
    description: 'Google Cloud region e.g. us-central1, us-east4'
    default: 'us-central1'
    required: false
  add_comment:
    description: 'Add a comment to an open PR as the final step - defaults to "true"'
    default: 'true'
    required: false
  kernel_name:
    description: 'Notebook kernel to use for the execution environment - defaults to python3'
    default: 'python3'
    required: false
  vertex_container_name:
    description: 'The base container image to use. Defaults to the basic Python container.'
    default: 'gcr.io/deeplearning-platform-release/base-cu110:latest'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    # Move the files that are to be executed into a directory and rename them
    - name: 'stage-files'
      shell: 'bash'
      env:
        INPUT_ALLOWLIST: '${{ inputs.allowlist }}'
        INPUT_DIR: '${{ github.sha }}'
      run: |-
        set -x;

        mkdir -p "./${INPUT_DIR}";
        while IFS= read -r -d '' t; do files+=("$t"); done \
          < <(printf '%s' "$INPUT_ALLOWLIST" | xargs printf '%s\0')
        for file in "${files[@]}";
        do
          f2=$(printf '%s' "${file}" | tr '/' '_');
          cp "${file}" "./${INPUT_DIR}/${f2}";
        done;
        raw_notebooks=$(ls "./${INPUT_DIR}" | xargs)
        safe_notebooks=$(printf '%s' "$raw_notebooks" | tr -d '\n\r')
        echo "notebooks=${safe_notebooks}" >> "$GITHUB_OUTPUT"
    # Setup gcloud CLI
    - name: 'setup-cloud-sdk'
      uses: 'google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f' # v2
    - name: 'upload-folder'
      uses: 'google-github-actions/upload-cloud-storage@c0f6160ff80057923ff50e5e567695cea181ec23' # v2
      with:
        path: './${{ github.sha }}'
        destination: '${{ inputs.gcs_source_bucket }}'
        gzip: false
        headers: |-
          content-type: application/octet-stream
    - name: 'vertex-execution'
      shell: 'bash'
      env:
        INPUT_NOTEBOOKS: '${{ inputs.allowlist }}'
        INPUT_COMMIT_SHA: '${{ github.sha }}'
        INPUT_OUTPUT_LOCATION: 'gs://${{ inputs.gcs_output_bucket }}'
        INPUT_SOURCE_LOCATION: 'gs://${{ inputs.gcs_source_bucket }}'
        INPUT_MACHINE_TYPE: '${{ inputs.vertex_machine_type }}'
        INPUT_REGION: '${{ inputs.region }}'
        INPUT_KERNEL: '${{ inputs.kernel_name }}'
        INPUT_CONTAINER: '${{ inputs.vertex_container_name }}'
      run: |-
        set -x;
        echo '{"jobs": []}' > jobs.json

        notebooks=()
        while IFS= read -r -d '' t; do notebooks+=("$t"); done \
          < <(printf '%s' "$INPUT_NOTEBOOKS" | xargs printf '%s\0')

        for file in "${notebooks[@]}";
        do
          file=$(printf '%s' "${file}" | tr '/' '_');
          job_name="${INPUT_COMMIT_SHA}:${file}";
          source_file="${INPUT_SOURCE_LOCATION}/${INPUT_COMMIT_SHA}/${file}";
          output_file="${INPUT_OUTPUT_LOCATION}/${INPUT_COMMIT_SHA}/${file}";

          output=$(gcloud ai custom-jobs create \
             --format=json \
             --region="${INPUT_REGION}" \
             --display-name="${job_name}" \
             --labels=commit_sha="${INPUT_COMMIT_SHA}" \
             --worker-pool-spec=machine-type="${INPUT_MACHINE_TYPE}",replica-count="1",container-image-uri="${INPUT_CONTAINER}" \
             --args=nbexecutor,--input-notebook="${source_file}",--output-notebook="${output_file}",--kernel-name="${INPUT_KERNEL}");

          echo "$output" | jq -c > training.json
          jq '.jobs[.jobs | length] |= . + '$(cat training.json) jobs.json > jobs_new.json
          cat jobs_new.json | jq -c > jobs.json

        done;
        safe_jobs=$(printf '%s' "$(cat jobs.json)" | tr -d '\n\r')
        echo "training_jobs=${safe_jobs}" >> "$GITHUB_OUTPUT"
    - name: 'add-comment'
      env:
        vertex_job_uri: 'https://console.cloud.google.com/vertex-ai/locations'
        vertex_notebook_uri: 'https://notebooks.cloud.google.com/view'
        region: '${{ inputs.region }}'
        add_comment: '${{ inputs.add_comment }}'
      uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7.0.1
      with:
        script: |
          try {
            if (process.env.add_comment.toLowerCase() !== 'true') {
              return;
            }
            const fs = require('fs');

            const region = process.env.region;
            const notebookUri = process.env.vertex_notebook_uri;
            const vertexUri = process.env.vertex_job_uri;
            const project = process.env.GCLOUD_PROJECT;
            const jsonStr = fs.readFileSync('jobs.json');

            const data = JSON.parse(jsonStr);
            const jid_re = /\/([0-9]+)$/;
            for (const ix in data.jobs) {
              const job = data.jobs[ix];
              const nbName = job.displayName.split(":")[1];
              const jobId = job.name.match(jid_re)[0].replace("/", "");
              const outFile = job.jobSpec.workerPoolSpecs[0].containerSpec.args.filter((a) => a.startsWith("--output-notebook=gs://")).map((a) => a.replace("--output-notebook=gs://", ""))[0];
              const jobUrl = encodeURI(`${vertexUri}/${region}/training/${jobId}?project=${project}`);
              const nbUrl = encodeURI(`${notebookUri}/${outFile}`);
              const message = `Automatic running of notebook **${nbName}** underway.

              You can review the status of the job within Vertex AI: [Job ${jobId}](${jobUrl})

              Once complete the notebook with output cells will be available to view [${nbName}](${nbUrl})`;
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message,
              });
            }
          } catch(err) {
            core.setFailed(`Failed to generate add comment with Vertex AI links: ${err}`);
          }
