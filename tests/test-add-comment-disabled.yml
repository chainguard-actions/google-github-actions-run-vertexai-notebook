name: Test add_comment=false skips comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy notebook file for the allowlist input
      - name: Create dummy notebook file
        run: |
          cat > dummy.ipynb << 'EOF'
          {
            "cells": [],
            "metadata": {},
            "nbformat": 4,
            "nbformat_minor": 4
          }
          EOF

      # Invoke the action under test with add_comment=false
      # The action will fail at GCP steps (no credentials), but we verify
      # the add_comment logic inline below
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcs_source_bucket: 'fake-project/nbr/source'
          gcs_output_bucket: 'fake-project/nbr/output'
          allowlist: 'dummy.ipynb'
          add_comment: 'false'

      # Verify the add_comment=false logic: the script checks add_comment env var
      # and returns early if it's not 'true'. We test this logic directly.
      - name: Test add_comment=false early return logic
        id: check-add-comment
        env:
          add_comment: 'false'
        run: |
          # Simulate the JS logic: if add_comment != 'true', return early
          if [ "$(echo "$add_comment" | tr '[:upper:]' '[:lower:]')" != "true" ]; then
            echo "add_comment is not true, skipping comment"
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "add_comment is true, would post comment"
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - name: Assert comment was skipped
        env:
          ACTUAL: ${{ steps.check-add-comment.outputs.skipped }}
        run: |
          echo "actual skipped: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected comment to be skipped when add_comment=false"
            exit 1
          fi
          echo "PASS: comment correctly skipped when add_comment=false"

      - name: Test add_comment=true would proceed
        id: check-add-comment-true
        env:
          add_comment: 'true'
        run: |
          if [ "$(echo "$add_comment" | tr '[:upper:]' '[:lower:]')" != "true" ]; then
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - name: Assert comment would proceed when add_comment=true
        env:
          ACTUAL: ${{ steps.check-add-comment-true.outputs.skipped }}
        run: |
          echo "actual skipped: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected comment to proceed when add_comment=true"
            exit 1
          fi
          echo "PASS: comment correctly proceeds when add_comment=true"

      - name: Test add_comment=TRUE (case insensitive)
        id: check-add-comment-upper
        env:
          add_comment: 'TRUE'
        run: |
          if [ "$(echo "$add_comment" | tr '[:upper:]' '[:lower:]')" != "true" ]; then
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - name: Assert case-insensitive TRUE is treated as true
        env:
          ACTUAL: ${{ steps.check-add-comment-upper.outputs.skipped }}
        run: |
          echo "actual skipped: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'TRUE' to be treated as true (case insensitive)"
            exit 1
          fi
          echo "PASS: case-insensitive TRUE correctly treated as true"
