name: Test add_comment=false skips comment step
# Tests that when add_comment is set to false, the action's comment step
# is skipped. The action will fail at the gcloud setup step (no GCP credentials),
# but we verify the add_comment=false logic in the github-script step independently.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy notebook file so the stage-files step has something to work with
      - name: Create dummy notebook file
        run: |
          echo '{"cells": [], "metadata": {}, "nbformat": 4, "nbformat_minor": 5}' > mynotebook.ipynb

      # Run the action with add_comment=false; it will fail at gcloud steps
      # (no GCP credentials), but we verify the input is accepted.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcs_source_bucket: fake-project/nbr/source
          gcs_output_bucket: fake-project/nbr/output
          allowlist: mynotebook.ipynb
          add_comment: "false"

      # Simulate the add-comment step logic with add_comment=false
      # This mirrors the JavaScript logic in the action's add-comment step
      - name: Test add_comment=false logic
        env:
          add_comment: "false"
        run: |
          set -e
          # Simulate what the github-script step does when add_comment != 'true'
          if [ "${add_comment,,}" != "true" ]; then
            echo "PASS: add_comment is '${add_comment}', comment step would be skipped"
          else
            echo "FAIL: add_comment should not be 'true'"
            exit 1
          fi

      # Simulate the add-comment step logic with add_comment=true (default)
      - name: Test add_comment=true logic (default)
        env:
          add_comment: "true"
        run: |
          set -e
          if [ "${add_comment,,}" = "true" ]; then
            echo "PASS: add_comment is '${add_comment}', comment step would run"
          else
            echo "FAIL: add_comment should be 'true'"
            exit 1
          fi
