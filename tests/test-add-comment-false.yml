name: Test add_comment=false skips comment
# Tests that when add_comment is set to 'false', the action still stages files
# correctly. The action will fail at setup-cloud-sdk (no GCP credentials),
# but the stage-files step runs first and we verify its output.
on:
  workflow_dispatch:

jobs:
  test-add-comment-false:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy notebook file to be staged
      - name: Create test notebook
        run: |
          mkdir -p notebooks
          echo '{"cells": [], "metadata": {}, "nbformat": 4, "nbformat_minor": 5}' > notebooks/mynotebook.ipynb

      # Call the action under test with add_comment=false.
      # The action will fail at setup-cloud-sdk (no GCP creds) but
      # the stage-files step runs first.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcs_source_bucket: 'fake-project/nbr/source'
          gcs_output_bucket: 'fake-project/nbr/output'
          allowlist: 'notebooks/mynotebook.ipynb'
          add_comment: 'false'

      # Verify the staged directory was created by the stage-files step
      - name: Assert staged file exists
        run: |
          dir="./${{ github.sha }}"
          expected_file="${dir}/notebooks_mynotebook.ipynb"
          echo "Checking for staged file: $expected_file"
          if [ ! -f "$expected_file" ]; then
            echo "FAIL: expected staged file not found at $expected_file"
            ls -la "$dir" || echo "Directory does not exist"
            exit 1
          fi
          echo "PASS: staged file found when add_comment=false"

      # Verify add_comment=false logic: the JavaScript in the action returns early
      # when add_comment !== 'true'. We verify this by checking the env var directly.
      - name: Verify add_comment=false causes early return in comment logic
        env:
          add_comment: 'false'
        run: |
          add_comment_val="${add_comment}"
          echo "add_comment value: $add_comment_val"

          if [ "$(echo "$add_comment_val" | tr '[:upper:]' '[:lower:]')" != "true" ]; then
            echo "PASS: add_comment is not 'true', comment step would be skipped (early return)"
            exit 0
          fi

          echo "FAIL: expected early return when add_comment=false"
          exit 1
