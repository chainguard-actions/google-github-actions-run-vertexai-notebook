name: Test add_comment=false skips PR comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create multiple fake notebook files to test multi-file staging
      - name: Create test notebook files
        run: |
          mkdir -p subdir/notebooks
          cat > subdir/notebooks/notebook_a.ipynb << 'EOF'
          {
            "cells": [],
            "metadata": {"kernelspec": {"display_name": "Python 3", "language": "python", "name": "python3"}},
            "nbformat": 4,
            "nbformat_minor": 4
          }
          EOF
          cat > subdir/notebooks/notebook_b.ipynb << 'EOF'
          {
            "cells": [],
            "metadata": {"kernelspec": {"display_name": "Python 3", "language": "python", "name": "python3"}},
            "nbformat": 4,
            "nbformat_minor": 4
          }
          EOF
          echo "Created test notebooks:"
          ls -la subdir/notebooks/

      # Run the action with add_comment=false and multiple notebooks
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcs_source_bucket: 'fake-project/nbr/source'
          gcs_output_bucket: 'fake-project/nbr/output'
          allowlist: 'subdir/notebooks/notebook_a.ipynb subdir/notebooks/notebook_b.ipynb'
          add_comment: 'false'
          region: 'us-east4'
          vertex_machine_type: 'n1-standard-8'
          kernel_name: 'python3'

      # Assert that the stage-files step ran and created the SHA directory
      - name: Assert stage-files created directory for multiple notebooks
        run: |
          SHA="${{ github.sha }}"
          echo "Looking for directory: ./${SHA}"
          if [ ! -d "./${SHA}" ]; then
            echo "FAIL: Expected directory ./${SHA} was not created by stage-files step"
            exit 1
          fi
          echo "PASS: Directory ./${SHA} exists"

      # Assert both notebooks were staged with slashes replaced by underscores
      - name: Assert both notebooks were staged correctly
        run: |
          SHA="${{ github.sha }}"
          EXPECTED_A="./${SHA}/subdir_notebooks_notebook_a.ipynb"
          EXPECTED_B="./${SHA}/subdir_notebooks_notebook_b.ipynb"

          echo "Looking for staged file A: ${EXPECTED_A}"
          if [ ! -f "${EXPECTED_A}" ]; then
            echo "FAIL: Expected staged file ${EXPECTED_A} not found"
            echo "Contents of ./${SHA}:"
            ls -la "./${SHA}" 2>/dev/null || echo "(directory not found)"
            exit 1
          fi
          echo "PASS: Staged file A exists"

          echo "Looking for staged file B: ${EXPECTED_B}"
          if [ ! -f "${EXPECTED_B}" ]; then
            echo "FAIL: Expected staged file ${EXPECTED_B} not found"
            echo "Contents of ./${SHA}:"
            ls -la "./${SHA}" 2>/dev/null || echo "(directory not found)"
            exit 1
          fi
          echo "PASS: Staged file B exists"

      # Assert that exactly 2 files were staged
      - name: Assert correct number of staged files
        run: |
          SHA="${{ github.sha }}"
          COUNT=$(ls "./${SHA}" 2>/dev/null | wc -l | tr -d ' ')
          echo "Number of staged files: ${COUNT}"
          if [ "${COUNT}" != "2" ]; then
            echo "FAIL: Expected 2 staged files, got ${COUNT}"
            ls -la "./${SHA}" 2>/dev/null
            exit 1
          fi
          echo "PASS: Exactly 2 files staged"
