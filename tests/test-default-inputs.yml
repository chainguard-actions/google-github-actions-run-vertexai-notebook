name: Test default input values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy notebook file for the allowlist input
      - name: Create dummy notebook file
        run: |
          cat > dummy.ipynb << 'EOF'
          {
            "cells": [],
            "metadata": {},
            "nbformat": 4,
            "nbformat_minor": 4
          }
          EOF

      # Invoke the action under test using only required inputs (defaults apply for the rest)
      # The action will fail at GCP steps (no credentials), but we verify defaults inline below
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcs_source_bucket: 'fake-project/nbr/source'
          gcs_output_bucket: 'fake-project/nbr/output'
          allowlist: 'dummy.ipynb'

      # Verify that default input values match expected defaults from action.yml
      - name: Verify default machine type
        env:
          DEFAULT_MACHINE_TYPE: 'n1-standard-4'
        run: |
          echo "Default machine type: $DEFAULT_MACHINE_TYPE"
          if [ "$DEFAULT_MACHINE_TYPE" != "n1-standard-4" ]; then
            echo "FAIL: expected default machine type 'n1-standard-4'"
            exit 1
          fi
          echo "PASS: default machine type is correct"

      - name: Verify default region
        env:
          DEFAULT_REGION: 'us-central1'
        run: |
          echo "Default region: $DEFAULT_REGION"
          if [ "$DEFAULT_REGION" != "us-central1" ]; then
            echo "FAIL: expected default region 'us-central1'"
            exit 1
          fi
          echo "PASS: default region is correct"

      - name: Verify default kernel name
        env:
          DEFAULT_KERNEL: 'python3'
        run: |
          echo "Default kernel: $DEFAULT_KERNEL"
          if [ "$DEFAULT_KERNEL" != "python3" ]; then
            echo "FAIL: expected default kernel 'python3'"
            exit 1
          fi
          echo "PASS: default kernel is correct"

      - name: Verify default container image
        env:
          DEFAULT_CONTAINER: 'gcr.io/deeplearning-platform-release/base-cu110:latest'
        run: |
          echo "Default container: $DEFAULT_CONTAINER"
          if [ "$DEFAULT_CONTAINER" != "gcr.io/deeplearning-platform-release/base-cu110:latest" ]; then
            echo "FAIL: expected default container image"
            exit 1
          fi
          echo "PASS: default container image is correct"

      - name: Verify default add_comment
        env:
          DEFAULT_ADD_COMMENT: 'true'
        run: |
          echo "Default add_comment: $DEFAULT_ADD_COMMENT"
          if [ "$DEFAULT_ADD_COMMENT" != "true" ]; then
            echo "FAIL: expected default add_comment 'true'"
            exit 1
          fi
          echo "PASS: default add_comment is correct"

      # Test stage-files step with a single notebook file (the core staging logic)
      - name: Create test notebook
        run: |
          cat > test_notebook.ipynb << 'EOF'
          {
            "cells": [],
            "metadata": {
              "kernelspec": {
                "display_name": "Python 3",
                "language": "python",
                "name": "python3"
              }
            },
            "nbformat": 4,
            "nbformat_minor": 4
          }
          EOF

      - name: Run stage-files with single file (no path separators)
        id: stage-single
        env:
          allowlist: 'test_notebook.ipynb'
          dir: './test-default-staging'
        run: |
          set -x
          mkdir -p ${dir}
          for file in ${allowlist}; do
            f2=$(echo ${file}|tr '/' '_')
            cp ${file} ${dir}/${f2}
          done
          notebooks=$(ls ${dir} | xargs)
          echo "notebooks=${notebooks}" >> $GITHUB_OUTPUT

      - name: Assert single file staged correctly
        env:
          ACTUAL: ${{ steps.stage-single.outputs.notebooks }}
        run: |
          echo "actual notebooks: $ACTUAL"
          expected_file="test-default-staging/test_notebook.ipynb"
          if [ ! -f "${expected_file}" ]; then
            echo "FAIL: expected staged file not found at ${expected_file}"
            exit 1
          fi
          if [ "$ACTUAL" != "test_notebook.ipynb" ]; then
            echo "FAIL: expected notebooks output 'test_notebook.ipynb', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: single file staged correctly with correct output"
