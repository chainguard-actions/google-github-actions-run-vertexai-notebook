name: Test default input values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake notebook file at the repo root level (no subdirectory)
      - name: Create test notebook at root level
        run: |
          cat > my_notebook.ipynb << 'EOF'
          {
            "cells": [
              {
                "cell_type": "code",
                "execution_count": null,
                "metadata": {},
                "outputs": [],
                "source": ["print('hello world')"]
              }
            ],
            "metadata": {
              "kernelspec": {
                "display_name": "Python 3",
                "language": "python",
                "name": "python3"
              },
              "language_info": {
                "name": "python",
                "version": "3.8.0"
              }
            },
            "nbformat": 4,
            "nbformat_minor": 4
          }
          EOF
          echo "Created my_notebook.ipynb"
          ls -la my_notebook.ipynb

      # Run the action using only required inputs (all optional inputs use defaults)
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcs_source_bucket: 'my-project/notebooks/source'
          gcs_output_bucket: 'my-project/notebooks/output'
          allowlist: 'my_notebook.ipynb'
          # add_comment defaults to 'true' - will try to comment but no PR exists
          # vertex_machine_type defaults to 'n1-standard-4'
          # region defaults to 'us-central1'
          # kernel_name defaults to 'python3'
          # vertex_container_name defaults to 'gcr.io/deeplearning-platform-release/base-cu110:latest'

      # Assert that the stage-files step ran and created the SHA directory
      - name: Assert stage-files created directory
        run: |
          SHA="${{ github.sha }}"
          echo "Looking for directory: ./${SHA}"
          if [ ! -d "./${SHA}" ]; then
            echo "FAIL: Expected directory ./${SHA} was not created by stage-files step"
            exit 1
          fi
          echo "PASS: Directory ./${SHA} exists"

      # Assert that the root-level notebook was staged correctly
      # Root-level file has no slashes, so name stays the same
      - name: Assert root-level notebook was staged correctly
        run: |
          SHA="${{ github.sha }}"
          # Root-level file: "my_notebook.ipynb" has no slashes, so tr '/' '_' is a no-op
          EXPECTED_FILE="./${SHA}/my_notebook.ipynb"
          echo "Looking for staged file: ${EXPECTED_FILE}"
          if [ ! -f "${EXPECTED_FILE}" ]; then
            echo "FAIL: Expected staged file ${EXPECTED_FILE} not found"
            echo "Contents of ./${SHA}:"
            ls -la "./${SHA}" 2>/dev/null || echo "(directory not found)"
            exit 1
          fi
          echo "PASS: Root-level notebook staged correctly as ${EXPECTED_FILE}"
