name: Test vertex-execution job JSON tracking logic
on:
  workflow_dispatch:
jobs:
  test-job-json-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Ensure jq is available (used by the action's vertex-execution step)
      - name: Ensure jq is available
        run: |
          jq --version || (apt-get update && apt-get install -y jq)

      # Create a minimal notebook file so stage-files can copy it
      - name: Create test notebook file
        run: |
          echo '{}' > test_notebook.ipynb

      # Call the action under test. It will succeed at stage-files (pure bash),
      # then fail at setup-cloud-sdk / upload-folder (no GCP credentials).
      # continue-on-error allows us to assert on the side effects.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcs_source_bucket: 'fake-project/nbr/source'
          gcs_output_bucket: 'fake-project/nbr/output'
          allowlist: 'test_notebook.ipynb'
          region: 'us-central1'
          add_comment: 'false'

      # Simulate the jobs.json initialization and accumulation logic
      # from the vertex-execution step (tests the jq logic independently)
      - name: Test jobs.json initialization and accumulation
        id: job-json
        run: |
          set -e

          # Initialize jobs.json as the action does
          echo '{"jobs": []}' > jobs.json

          # Simulate adding a first job (as if gcloud returned this)
          cat > training.json << 'EOF'
          {"name": "projects/123/locations/us-central1/customJobs/456", "displayName": "abc123:test_notebook.ipynb", "jobSpec": {"workerPoolSpecs": [{"containerSpec": {"args": ["nbexecutor", "--input-notebook=gs://bucket/abc123/test_notebook.ipynb", "--output-notebook=gs://outbucket/abc123/test_notebook.ipynb", "--kernel-name=python3"]}}]}}
          EOF

          # Replicate the jq accumulation logic from the action
          jq -c '.' training.json > training_compact.json
          jq '.jobs[.jobs | length] |= . + '"$(cat training_compact.json)" jobs.json > jobs_new.json
          cat jobs_new.json | jq -c > jobs.json

          # Simulate adding a second job
          cat > training2.json << 'EOF'
          {"name": "projects/123/locations/us-central1/customJobs/789", "displayName": "abc123:subdir_another.ipynb", "jobSpec": {"workerPoolSpecs": [{"containerSpec": {"args": ["nbexecutor", "--input-notebook=gs://bucket/abc123/subdir_another.ipynb", "--output-notebook=gs://outbucket/abc123/subdir_another.ipynb", "--kernel-name=python3"]}}]}}
          EOF

          jq -c '.' training2.json > training2_compact.json
          jq '.jobs[.jobs | length] |= . + '"$(cat training2_compact.json)" jobs.json > jobs_new.json
          cat jobs_new.json | jq -c > jobs.json

          echo "jobs_count=$(jq '.jobs | length' jobs.json)" >> $GITHUB_OUTPUT

      - name: Assert jobs.json has correct number of jobs
        env:
          JOBS_COUNT: ${{ steps.job-json.outputs.jobs_count }}
        run: |
          echo "jobs_count: $JOBS_COUNT"
          if [ "$JOBS_COUNT" != "2" ]; then
            echo "FAIL: expected 2 jobs in jobs.json, got $JOBS_COUNT"
            exit 1
          fi
          echo "PASS: jobs.json contains correct number of jobs"

      - name: Assert jobs.json has correct job display names
        run: |
          echo "jobs.json content:"
          cat jobs.json | jq .

          DISPLAY_NAME_0=$(jq -r '.jobs[0].displayName' jobs.json)
          echo "displayName[0]: $DISPLAY_NAME_0"
          if [ "$DISPLAY_NAME_0" != "abc123:test_notebook.ipynb" ]; then
            echo "FAIL: expected displayName 'abc123:test_notebook.ipynb', got '$DISPLAY_NAME_0'"
            exit 1
          fi

          DISPLAY_NAME_1=$(jq -r '.jobs[1].displayName' jobs.json)
          echo "displayName[1]: $DISPLAY_NAME_1"
          if [ "$DISPLAY_NAME_1" != "abc123:subdir_another.ipynb" ]; then
            echo "FAIL: expected displayName 'abc123:subdir_another.ipynb', got '$DISPLAY_NAME_1'"
            exit 1
          fi

          echo "PASS: jobs.json has correct job display names"

      - name: Assert output-notebook args are present in job spec
        run: |
          OUT_ARG=$(jq -r '.jobs[0].jobSpec.workerPoolSpecs[0].containerSpec.args[] | select(startswith("--output-notebook="))' jobs.json)
          echo "output-notebook arg: $OUT_ARG"
          if [ -z "$OUT_ARG" ]; then
            echo "FAIL: --output-notebook arg not found in job spec"
            exit 1
          fi
          echo "PASS: --output-notebook arg present in job spec"
