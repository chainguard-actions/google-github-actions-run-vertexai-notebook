name: Test stage-files logic
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy notebook files
        run: |
          mkdir -p subdir
          echo '{"cells": []}' > mynotebook.ipynb
          echo '{"cells": []}' > subdir/another.ipynb

      # The action will fail at setup-cloud-sdk (no GCP auth), but the
      # stage-files step runs first and we can verify its output.
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcs_source_bucket: fake-project/nbr/source
          gcs_output_bucket: fake-project/nbr/output
          allowlist: mynotebook.ipynb subdir/another.ipynb
          add_comment: 'false'

      - name: Assert staged files exist
        run: |
          sha="${GITHUB_SHA}"
          echo "Checking staged directory contents under ./${sha}/"
          ls -la "./${sha}/" || { echo "FAIL: staged directory not found"; exit 1; }

          if [ ! -f "./${sha}/mynotebook.ipynb" ]; then
            echo "FAIL: mynotebook.ipynb not found in staged directory"
            exit 1
          fi
          echo "PASS: mynotebook.ipynb found"

          if [ ! -f "./${sha}/subdir_another.ipynb" ]; then
            echo "FAIL: subdir_another.ipynb (renamed from subdir/another.ipynb) not found"
            ls -la "./${sha}/"
            exit 1
          fi
          echo "PASS: subdir_another.ipynb found (slash replaced with underscore)"

      - name: Assert original files are unchanged
        run: |
          if [ ! -f "./mynotebook.ipynb" ]; then
            echo "FAIL: original mynotebook.ipynb was removed"
            exit 1
          fi
          if [ ! -f "./subdir/another.ipynb" ]; then
            echo "FAIL: original subdir/another.ipynb was removed"
            exit 1
          fi
          echo "PASS: original files still present"
