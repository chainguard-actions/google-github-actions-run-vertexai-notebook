name: Test stage-files with multiple notebooks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create multiple test notebook files
      - name: Create test notebooks
        run: |
          mkdir -p notebooks/subdir
          echo '{"cells": [], "metadata": {}, "nbformat": 4, "nbformat_minor": 5}' > notebooks/notebook_a.ipynb
          echo '{"cells": [], "metadata": {}, "nbformat": 4, "nbformat_minor": 5}' > notebooks/subdir/notebook_b.ipynb

      # Test the stage-files bash logic directly with multiple files
      # This mirrors the action's stage-files step: copy files into a dir with '/' replaced by '_'
      - name: Test stage-files logic with multiple notebooks
        env:
          allowlist: 'notebooks/notebook_a.ipynb notebooks/subdir/notebook_b.ipynb'
          dir: './test-staging-dir'
        run: |
          set -e
          mkdir -p ${dir}
          for file in ${allowlist}; do
            f2=$(echo ${file}|tr '/' '_')
            cp ${file} ${dir}/${f2}
          done
          echo "notebooks=$(ls ${dir} | xargs)" >> $GITHUB_OUTPUT

      - name: Assert first file was staged correctly
        run: |
          expected_file="./test-staging-dir/notebooks_notebook_a.ipynb"
          echo "Checking for renamed file: ${expected_file}"
          if [ ! -f "${expected_file}" ]; then
            echo "FAIL: expected renamed file not found at ${expected_file}"
            ls -la ./test-staging-dir/ || echo "(directory listing failed)"
            exit 1
          fi
          echo "PASS: first file was correctly renamed and staged"

      - name: Assert second file was staged correctly
        run: |
          expected_file="./test-staging-dir/notebooks_subdir_notebook_b.ipynb"
          echo "Checking for renamed file: ${expected_file}"
          if [ ! -f "${expected_file}" ]; then
            echo "FAIL: expected renamed file not found at ${expected_file}"
            ls -la ./test-staging-dir/ || echo "(directory listing failed)"
            exit 1
          fi
          echo "PASS: second file was correctly renamed and staged"

      # Run the action with continue-on-error since gcloud steps will fail without credentials
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcs_source_bucket: 'fake-project/nbr/source'
          gcs_output_bucket: 'fake-project/nbr/output'
          allowlist: 'notebooks/notebook_a.ipynb notebooks/subdir/notebook_b.ipynb'
          region: 'us-central1'
          add_comment: 'false'

      # The action is expected to fail at gcloud steps (no credentials).
      # Verify the action was invoked (outcome is either success or failure, not skipped).
      - name: Assert action was invoked
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: ${OUTCOME}"
          if [ "${OUTCOME}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: ${OUTCOME})"
