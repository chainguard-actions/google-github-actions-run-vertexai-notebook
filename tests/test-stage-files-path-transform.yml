name: Test stage-files path transformation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create sample notebook files in subdirectories to test path transformation
      - name: Create sample notebook files
        run: |
          mkdir -p subdir/nested
          cat > subdir/nested/notebook.ipynb << 'EOF'
          {
            "cells": [],
            "metadata": {
              "kernelspec": {
                "display_name": "Python 3",
                "language": "python",
                "name": "python3"
              }
            },
            "nbformat": 4,
            "nbformat_minor": 4
          }
          EOF
          cat > subdir/another.ipynb << 'EOF'
          {
            "cells": [],
            "metadata": {},
            "nbformat": 4,
            "nbformat_minor": 4
          }
          EOF

      # Invoke the action under test (will fail at GCP steps without credentials)
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcs_source_bucket: 'fake-project/nbr/source'
          gcs_output_bucket: 'fake-project/nbr/output'
          allowlist: 'subdir/nested/notebook.ipynb subdir/another.ipynb'
          add_comment: 'false'

      # Run the stage-files logic with multiple files including nested paths
      # Use a separate directory to avoid conflicts with the action's own step
      - name: Run stage-files logic with nested paths
        id: stage
        env:
          allowlist: 'subdir/nested/notebook.ipynb subdir/another.ipynb'
          dir: './test-path-staging'
        run: |
          set -x
          mkdir -p ${dir}
          for file in ${allowlist}; do
            f2=$(echo ${file}|tr '/' '_')
            cp ${file} ${dir}/${f2}
          done
          notebooks=$(ls ${dir} | xargs)
          echo "notebooks=${notebooks}" >> $GITHUB_OUTPUT

      - name: Assert nested path file was transformed correctly
        run: |
          # subdir/nested/notebook.ipynb should become subdir_nested_notebook.ipynb
          expected_file="test-path-staging/subdir_nested_notebook.ipynb"
          echo "Checking for transformed file: ${expected_file}"
          if [ ! -f "${expected_file}" ]; then
            echo "FAIL: expected transformed file not found at ${expected_file}"
            ls -la "test-path-staging/" || echo "Directory does not exist"
            exit 1
          fi
          echo "PASS: nested path file correctly transformed"

      - name: Assert flat path file was transformed correctly
        run: |
          # subdir/another.ipynb should become subdir_another.ipynb
          expected_file="test-path-staging/subdir_another.ipynb"
          echo "Checking for transformed file: ${expected_file}"
          if [ ! -f "${expected_file}" ]; then
            echo "FAIL: expected transformed file not found at ${expected_file}"
            ls -la "test-path-staging/" || echo "Directory does not exist"
            exit 1
          fi
          echo "PASS: flat path file correctly transformed"

      - name: Assert both notebooks listed in output
        env:
          ACTUAL: ${{ steps.stage.outputs.notebooks }}
        run: |
          echo "actual notebooks output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: notebooks output is empty"
            exit 1
          fi
          # Should contain both transformed filenames
          if echo "$ACTUAL" | grep -q "subdir_nested_notebook.ipynb" && \
             echo "$ACTUAL" | grep -q "subdir_another.ipynb"; then
            echo "PASS: both notebooks listed in output"
          else
            echo "FAIL: not all notebooks listed in output"
            echo "Expected both 'subdir_nested_notebook.ipynb' and 'subdir_another.ipynb'"
            exit 1
          fi
