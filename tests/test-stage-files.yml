name: Test stage-files step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake notebook file to be staged
      - name: Create test notebook file
        run: |
          mkdir -p notebooks
          cat > notebooks/test_notebook.ipynb << 'EOF'
          {
            "cells": [],
            "metadata": {
              "kernelspec": {
                "display_name": "Python 3",
                "language": "python",
                "name": "python3"
              }
            },
            "nbformat": 4,
            "nbformat_minor": 4
          }
          EOF
          echo "Created test notebook at notebooks/test_notebook.ipynb"
          ls -la notebooks/

      # Run the action with continue-on-error since it will fail at gcloud steps
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcs_source_bucket: 'fake-project/nbr/source'
          gcs_output_bucket: 'fake-project/nbr/output'
          allowlist: 'notebooks/test_notebook.ipynb'
          add_comment: 'false'
          region: 'us-central1'
          vertex_machine_type: 'n1-standard-4'

      # Assert that the stage-files step ran and created the SHA directory
      - name: Assert stage-files created directory
        run: |
          SHA="${{ github.sha }}"
          echo "Looking for directory: ./${SHA}"
          if [ ! -d "./${SHA}" ]; then
            echo "FAIL: Expected directory ./${SHA} was not created by stage-files step"
            exit 1
          fi
          echo "PASS: Directory ./${SHA} exists"

      # Assert that the notebook was copied and renamed (slashes replaced with underscores)
      - name: Assert notebook was staged correctly
        run: |
          SHA="${{ github.sha }}"
          EXPECTED_FILE="./${SHA}/notebooks_test_notebook.ipynb"
          echo "Looking for staged file: ${EXPECTED_FILE}"
          if [ ! -f "${EXPECTED_FILE}" ]; then
            echo "FAIL: Expected staged file ${EXPECTED_FILE} not found"
            echo "Contents of ./${SHA}:"
            ls -la "./${SHA}" 2>/dev/null || echo "(directory not found)"
            exit 1
          fi
          echo "PASS: Staged file ${EXPECTED_FILE} exists"
